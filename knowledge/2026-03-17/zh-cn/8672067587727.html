<h1>如何取消订阅？</h1>
<h3 id="h_01HMVV63YSMN5BPB0PMHKG581E">信用卡付款订阅</h3><p>可自行于扣款日前到 <a href="https://en.macromicro.me/user/settings">会员档案 </a>&gt; <a href="https://sc.macromicro.me/user/order-history">付费纪录</a> 调整订阅状态</p><p> </p><h3 id="h_01HMVV68P7QSM7RF6QSH71QT6V">PayPal 订阅</h3><p>需回到 PayPal 平台取消绑定</p><p>取消订阅后自下期停止自动续约，不影响已扣款、续约会员资格。</p><p> </p><hr><p><br>提醒您，财经M平方每年皆随平台开发程度，评估调整订阅方案价格。订阅用户凡透过信用卡或 PayPal 持续订阅，将可终身保有最初加入时的优惠方案；惟一旦取消或中断订阅，将丧失此项权益，未来重新订阅时将适用当时最新的订阅价格。</p>
