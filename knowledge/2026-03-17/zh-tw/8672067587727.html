<h1>如何取消訂閱？</h1>
<h3 id="h_01HMVV2VDZT66KVTMVGMKV3NQV"><span data-sheets-root="1" data-sheets-userformat='{"2":1049473,"3":{"1":0},"10":1,"11":4,"12":0,"23":1}' data-sheets-value="data-sheets-value">信用卡付款訂閱</span></h3><p><span data-sheets-root="1" data-sheets-userformat='{"2":1049473,"3":{"1":0},"10":1,"11":4,"12":0,"23":1}' data-sheets-value="data-sheets-value">可自行於扣款日前到 </span><a href="https://www.macromicro.me/user/settings" target="_blank" rel="noopener noreferrer"><span data-sheets-root="1" data-sheets-userformat='{"2":1049473,"3":{"1":0},"10":1,"11":4,"12":0,"23":1}' data-sheets-value="data-sheets-value">會員檔案 </span></a><span data-sheets-root="1" data-sheets-userformat='{"2":1049473,"3":{"1":0},"10":1,"11":4,"12":0,"23":1}' data-sheets-value="data-sheets-value">&gt; </span><a href="https://www.macromicro.me/user/order-history" target="_blank" rel="noopener noreferrer"><span data-sheets-root="1" data-sheets-userformat='{"2":1049473,"3":{"1":0},"10":1,"11":4,"12":0,"23":1}' data-sheets-value="data-sheets-value">付費紀錄 </span></a><span data-sheets-root="1" data-sheets-userformat='{"2":1049473,"3":{"1":0},"10":1,"11":4,"12":0,"23":1}' data-sheets-value="data-sheets-value">調整訂閱狀態</span></p><p> </p><h3 id="h_01HMVV32SD1TC4GX84566HMR0Z"><span data-sheets-root="1" data-sheets-userformat='{"2":1049473,"3":{"1":0},"10":1,"11":4,"12":0,"23":1}' data-sheets-value="data-sheets-value">PayPal 訂閱</span></h3><p><span data-sheets-root="1" data-sheets-userformat='{"2":1049473,"3":{"1":0},"10":1,"11":4,"12":0,"23":1}' data-sheets-value="data-sheets-value">需回到 PayPal 平台取消綁定</span></p><p><span data-sheets-root="1" data-sheets-userformat='{"2":1049473,"3":{"1":0},"10":1,"11":4,"12":0,"23":1}' data-sheets-value="data-sheets-value">取消訂閱後自下期停止自動續約，不影響已扣款、續約會員資格。</span></p><p> </p><hr><p><span style="background-color: #FFFFFF;"><span data-sheets-root="1" data-sheets-userformat='{"2":1049473,"3":{"1":0},"10":1,"11":4,"12":0,"23":1}' data-sheets-value="data-sheets-value">提醒您，財經M平方每年皆隨平台開發程度，評估調整訂閱方案價格。訂閱用戶凡透過信用卡或 PayPal 持續訂閱，將可終身保有最初加入時的優惠方案；惟一旦取消或中斷訂閱，將喪失此項權益，未來重新訂閱時將適用當時最新的訂閱價格。</span></span></p>
