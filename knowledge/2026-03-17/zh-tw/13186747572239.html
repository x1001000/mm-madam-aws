<h1>為什麼登入中的帳號一直被登出，經常要重新登入?</h1>
<p data-start="34" data-end="120">目前網站採用「rolling 七日」機制，若在登入後七日內再次造訪網站，系統會自動延長登入狀態，讓您持續保持登入。</p><p data-start="122" data-end="190">但若習慣清除瀏覽器快取與網站資料，或是使用無痕模式瀏覽網站，將會導致登入憑證被清除，系統也會視為已登出，因此每次使用時就需要重新登入。</p><p data-start="192" data-end="206">為避免頻繁重新登入，建議：</p><ul data-start="207" data-end="247">
<li data-start="207" data-end="227">避免手動清除瀏覽器快取與網站資料</li>
<li data-start="228" data-end="247">使用一般模式（非無痕模式）開啟網站</li>
</ul>
