<h1>如何取消电子报信件？</h1>
<p dir="ltr"><span data-sheets-root="1">取消电子报订阅有两种方式：</span><br><br><span data-sheets-root="1">1. 直接在电子报中取消：每封电子报下方都有「cancel here」取消链接，点选即可退订。</span><br><br><span data-sheets-root="1">2. 从会员设置取消：</span></p><ul>
<li data-list-item-id="e127c2eca6cf23f9070d6d1a6fdf4e954">
<p dir="ltr"><span data-sheets-root="1">登录订阅账号后，点击网站右上角的「会员头像菜单」→「</span><a href="https://sc.macromicro.me/user/settings" target="_blank" rel="noopener noreferrer"><span data-sheets-root="1">会员档案</span></a><span data-sheets-root="1">」</span></p>
<p><img class="wysiwyg-image-resized" style="aspect-ratio: 1104/734; width: 50%;" src="https://support.macromicro.me/hc/article_attachments/15517945090959" width="1104" height="734"></p>
<p> </p>
</li>
<li data-list-item-id="edb9a9c577c0952a38bfc33f80282a086">
<p dir="ltr"><span data-sheets-root="1">点击「编辑」，</span><span data-sheets-root="1">即可更改电子报收件邮箱。</span></p>
<p><img class="wysiwyg-image-resized" style="aspect-ratio: 1108/652; width: 50%;" src="https://support.macromicro.me/hc/article_attachments/15517940249999" width="1108" height="652"></p>
<p><img class="wysiwyg-image-resized" style="aspect-ratio: 1110/1284; width: 50%;" src="https://support.macromicro.me/hc/article_attachments/15517945092623" width="1110" height="1284"></p>
</li>
</ul><p dir="ltr"> </p>
