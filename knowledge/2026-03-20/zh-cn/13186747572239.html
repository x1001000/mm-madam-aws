<h1>为什么登录中的账号会被登出，经常需要重新登录？</h1>
<p><span data-sheets-root="1">遇到这个状况通常与浏览器设置有关，请先参考以下说明：</span><br><br><span data-sheets-root="1">目前网站采用「rolling 七日」机制，只要在登录后七日内再次访问网站，系统就会自动延长登录状态，让您持续保持登录。</span><br><br><span data-sheets-root="1">但如果您习惯清除浏览器缓存，或是使用无痕模式浏览，登录凭证就会被清除，系统也会视为已登出，因此每次使用时需要重新登录。</span><br><br><span data-sheets-root="1">为了避免频繁重新登录，建议：</span><br><span data-sheets-root="1">・避免手动清除浏览器缓存与网站数据</span><br><span data-sheets-root="1">・使用一般模式（非无痕模式）打开网站</span><br><br><span data-sheets-root="1">若依上述调整后问题仍持续，欢迎来信 support@macromicro.me 说明情况，我们会进一步协助！</span></p>
