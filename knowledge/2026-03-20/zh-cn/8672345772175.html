<h1>如何汇出图表图片？</h1>
<p>成为 MM Prime/Max 或 MM Business 订阅会员后，就可以汇出图表图片了！</p><p>操作方式：在图表右上方点选「汇出」即可下载；也可以在「<a href="https://sc.macromicro.me/toolbox/chart-builder/line" target="_blank" rel="noopener noreferrer">工具箱</a>」中自行调整制作图，再汇出自订版本。</p><p>💡 MM Business 订阅用户可以进一步去除浮水印，让图表在报告中使用更灵活！</p><p> </p><p>还不是订阅会员吗？选择适合你的方案，<a href="https://sc.macromicro.me/subscribe#individual" target="_blank" rel="noopener noreferrer">开始订阅</a>！</p><p>延伸阅读：<a href="https://support.macromicro.me/hc/zh-cn/articles/8658188679183" target="_blank" rel="noopener noreferrer">成为订阅会员能享有哪些权益？</a></p><p> </p><p> </p>
