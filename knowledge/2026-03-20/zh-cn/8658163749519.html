<h1>如何修改个人资料？</h1>
<p dir="ltr"><span data-sheets-root="1">修改个人资料很简单，自己就可以操作！</span></p><ol>
<li data-list-item-id="ebbc1507689de217d6023b6dcb730b07f">
<p dir="ltr"><span data-sheets-root="1">登录订阅账号后，点击网站右上角的「会员头像菜单」→「</span><a href="https://sc.macromicro.me/user/settings" target="_blank" rel="noopener noreferrer"><span data-sheets-root="1">会员档案</span></a><span data-sheets-root="1">」</span></p>
<p><img class="wysiwyg-image-resized" style="aspect-ratio: 1104/734; width: 50%;" src="https://support.macromicro.me/hc/article_attachments/15517756586127" width="1104" height="734"></p>
<p> </p>
</li>
<li data-list-item-id="e46c81e4af60b092270e20f1814ac184c">
<p dir="ltr"><span data-sheets-root="1">点击「编辑」，即可修改姓名、邮件通知设置、发票统编等相关资料。</span></p>
<p><img class="wysiwyg-image-resized" style="aspect-ratio: 1108/652; width: 50%;" src="https://support.macromicro.me/hc/article_attachments/15517756586255" width="1108" height="652"></p>

</li>
