<h1>如何更改密码？</h1>
<p dir="ltr"><span data-sheets-root="1">更改密码有两种方式，选择您方便的方式操作即可：</span><br><br><span data-sheets-root="1">1. 登录后更改：点击网站右上角的「会员头像菜单」→「</span><a href="https://sc.macromicro.me/user/settings" target="_blank" rel="noopener noreferrer"><span data-sheets-root="1">会员档案</span></a><span data-sheets-root="1">」，點擊登入方式旁的「鉛筆圖示」即可设置新密码。</span></p><p dir="ltr"><img class="wysiwyg-image-resized" style="aspect-ratio: 714/872; width: 36.03%;" src="https://support.macromicro.me/hc/article_attachments/15517853280143" width="714" height="872"><br><br><span data-sheets-root="1">2. 忘记密码时：前往 </span><a href="https://sc.macromicro.me/login?next=/"><span data-sheets-root="1">登录</span></a><span data-sheets-root="1"> 页面，使用「忘记密码」功能，系统会寄送重设链接至您的邮箱。</span></p><p dir="ltr"> </p>
