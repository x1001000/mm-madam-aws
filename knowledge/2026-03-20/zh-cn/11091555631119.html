<h1>怎么合并我在网站上注册的多个帐号？</h1>
<p data-start="287" data-end="338">不小心使用不同方式创建了多个账号？别担心，您可以通过以下方式进行合并：</p><p data-start="340" data-end="414"><strong>■ 合并「社交账号」与「Email 账号」</strong><br><strong>请先使用「社交账号」登录，系统会自动检测是否与您的「Email 账号」使用相同邮箱，并自动完成合并。</strong></p><p data-start="416" data-end="476"><strong>■ 合并两个「社交账号」</strong><br><strong>请先使用其中一个「社交账号」登录，系统会自动检测是否与另一个账号使用相同邮箱，并进行合并。</strong></p><p data-start="416" data-end="476"> </p><p data-start="478" data-end="539">如系统未自动完成合并，或您需要进一步协助，欢迎发送邮件至 <a data-start="507" data-end="528" rel="noopener">support@macromicro.me</a><span aria-hidden="true"><a data-start="507" data-end="528" rel="noopener"></a></span>，由客服团队协助处理。</p>
