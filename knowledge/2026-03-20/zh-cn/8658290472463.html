<h1>如何升级訂閱方案？</h1>
<p><span data-sheets-root="1">想升级订阅方案？以下是操作方式：</span><br><br><span class="wysiwyg-font-size-large"><span data-sheets-root="1">■ 信用卡付款的用户</span></span><br><span data-sheets-root="1">登录订阅账号后，点击网站右上角的「会员头像菜单」→「</span><a style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;" href="https://sc.macromicro.me/user/settings" target="_blank" rel="noopener noreferrer">会员档案</a><span data-sheets-root="1">」→ 点击「升级方案」即可设置。升级后，系统会先依方案价差调整剩余订阅期限，并于下次续约扣款时正式以新方案计费。</span><br><br><span class="wysiwyg-font-size-large"><span data-sheets-root="1">■ 非信用卡付款的用户</span></span><br><span data-sheets-root="1">需先补齐方案价差后再进行调整，欢迎 </span><a href="https://support.macromicro.me/hc/zh-cn/requests/new"><span data-sheets-root="1">提交表单</span></a><span data-sheets-root="1"> 联系客服团队，我们会协助您完成升级！</span><br><br><span data-sheets-root="1">若有任何问题，欢迎随时来信 support@macromicro.me，我们很乐意协助！</span></p>
