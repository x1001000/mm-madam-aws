<h1>如何删除帐号？</h1>
<p data-start="323" data-end="409">如您确认需要删除账号，需由客服团队协助完成。请使用会员邮箱发送邮件至 <a data-start="374" data-end="395" rel="noopener">support@macromicro.me</a><span aria-hidden="true"><a data-start="374" data-end="395" rel="noopener"></a></span>，说明您确认删除账号的意愿。</p><p data-start="411" data-end="435">⚠️ 请注意，账号删除后将无法恢复，请谨慎操作。</p><p data-start="437" data-end="533">删除前，建议您先确认以下事项，以避免不必要的影响：<br>・如仍有有效订阅，请先至「付费记录」取消自动续费，以避免账号删除后仍被扣款<br>・订阅期间累积的报告与收藏内容将一并删除，且无法恢复</p><p data-start="535" data-end="611">账号删除完成后，我们将发送确认邮件至您的邮箱。同时，也非常欢迎您向 MM 团队提供使用反馈。我们十分重视每一位用户的意见，并期待未来有机会再次为您服务。</p>
