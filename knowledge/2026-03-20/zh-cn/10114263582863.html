<h1>如何使用MM Business进行团队协作？</h1>
<p><span data-sheets-root="1">MM Business 的团队协作功能，可以让多位成员共用下载额度和分享图表，非常适合团队使用！</span><br><br><span data-sheets-root="1">设置方式：</span><br><span data-sheets-root="1">点击网站右上角的头像 →「</span><a href="https://sc.macromicro.me/user/settings"><span data-sheets-root="1">会员档案</span></a><span data-sheets-root="1">」→「</span><a href="https://sc.macromicro.me/user/subaccounts"><span data-sheets-root="1">团队帐号管理</span></a><span data-sheets-root="1">」→ 新增协作者账号，即可启用协作功能。</span><br><br><span data-sheets-root="1">启用后，团队成员可共用数据下载额度（月缴每月 200 笔、年缴每月 500 笔），也可在「</span><a href="https://sc.macromicro.me/user/dashboards"><span data-sheets-root="1">我的仪表板</span></a><span data-sheets-root="1">」中分享图组及图表，还能查看所有成员的</span><a href="https://sc.macromicro.me/user/download-history"><span data-sheets-root="1">下载记录</span></a><span data-sheets-root="1">。</span><br><br><span data-sheets-root="1">若在设置过程有任何问题，欢迎来信 business@macromicro.me，我们很乐意协助！</span></p>
