<h1>使用信用卡付款订阅，没收到 3D OTP 验证简讯怎麽办？</h1>
<p dir="ltr"><span class="wysiwyg-font-size-large"><span data-sheets-root="1">3D 验证短信由您的发卡银行负责发送，如果一直没有收到相关验证短信，请试试以下步骤：</span></span></p><p dir="ltr"><br><span data-sheets-root="1">1. 确认手机网络信号正常，且未开启勿扰模式</span><br><span data-sheets-root="1">2. 稍等约 1–2 分钟（部分银行发送速度较慢）</span><br><span data-sheets-root="1">3. 关闭目前页面，重新从订阅页面开始付款流程</span><br><br><span data-sheets-root="1">若多次尝试后仍未收到，建议直接联系您的发卡银行，确认 3D 验证服务是否已开通。</span></p>
