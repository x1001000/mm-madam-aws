<h1>目前提供哪些方式註册？</h1>
<p style="-webkit-text-stroke-width: 0px; border: 0px solid #d9d9e3; box-sizing: border-box; color: #374151; font-family: Söhne, ui-sans-serif, system-ui, -apple-system, ' Segoe UI' , Roboto, Ubuntu, Cantarell, ' Noto Sans' , sans-serif, ' Helvetica Neue' , Arial, ' Apple Color Emoji' , ' Segoe UI Emoji' , ' Segoe UI Symbol' , ' Noto Color Emoji' font-size:16px; font-style: normal; font-variant-caps: normal; font-variant-ligatures: normal; font-weight: 400; letter-spacing: normal; orphans: 2; text-align: start; text-decoration-color: initial; text-decoration-style: initial; text-decoration-thickness: initial; text-indent: 0px; text-transform: none; white-space: pre-wrap; widows: 2; word-spacing: 0px;">目前财经M平方提供两大类注册方式：</p><h3 id="h_01HMTZGCHP2TS4FV988FB6A3HJ"><strong>一、社交媒体账号</strong></h3><p style="-webkit-text-stroke-width: 0px; border: 0px solid #d9d9e3; box-sizing: border-box; color: #374151; font-family: Söhne, ui-sans-serif, system-ui, -apple-system, ' Segoe UI' , Roboto, Ubuntu, Cantarell, ' Noto Sans' , sans-serif, ' Helvetica Neue' , Arial, ' Apple Color Emoji' , ' Segoe UI Emoji' , ' Segoe UI Symbol' , ' Noto Color Emoji' font-size:16px; font-style: normal; font-variant-caps: normal; font-variant-ligatures: normal; font-weight: 400; letter-spacing: normal; orphans: 2; text-align: start; text-decoration-color: initial; text-decoration-style: initial; text-decoration-thickness: initial; text-indent: 0px; text-transform: none; white-space: pre-wrap; widows: 2; word-spacing: 0px;">您可以通过社交媒体账号快速注册/登录，目前共有三个社交媒体支持这项服务：</p><p><img src="https://support.macromicro.me/hc/article_attachments/9362650907919" width="532" height="192"></p><h3 id="h_01HMTZGPYECSH1ZWSA07AWJHFE">二、Email 账号</h3><p style="-webkit-text-stroke-width: 0px; border: 0px solid #d9d9e3; box-sizing: border-box; color: #374151; font-family: Söhne, ui-sans-serif, system-ui, -apple-system, ' Segoe UI' , Roboto, Ubuntu, Cantarell, ' Noto Sans' , sans-serif, ' Helvetica Neue' , Arial, ' Apple Color Emoji' , ' Segoe UI Emoji' , ' Segoe UI Symbol' , ' Noto Color Emoji' font-size:16px; font-style: normal; font-variant-caps: normal; font-variant-ligatures: normal; font-weight: 400; letter-spacing: normal; orphans: 2; text-align: start; text-decoration-color: initial; text-decoration-style: initial; text-decoration-thickness: initial; text-indent: 0px; text-transform: none; white-space: pre-wrap; widows: 2; word-spacing: 0px;">您可以使用任意惯用的Email，并自行设置一组密码来创建一般会员账号。</p><p style="-webkit-text-stroke-width: 0px; border: 0px solid #d9d9e3; box-sizing: border-box; color: #374151; font-family: Söhne, ui-sans-serif, system-ui, -apple-system, ' Segoe UI' , Roboto, Ubuntu, Cantarell, ' Noto Sans' , sans-serif, ' Helvetica Neue' , Arial, ' Apple Color Emoji' , ' Segoe UI Emoji' , ' Segoe UI Symbol' , ' Noto Color Emoji' font-size:16px; font-style: normal; font-variant-caps: normal; font-variant-ligatures: normal; font-weight: 400; letter-spacing: normal; orphans: 2; text-align: start; text-decoration-color: initial; text-decoration-style: initial; text-decoration-thickness: initial; text-indent: 0px; text-transform: none; white-space: pre-wrap; widows: 2; word-spacing: 0px;">在创建账号后，系统将发送一封账号启用验证邮件。收到邮件后，请务必点击邮件内的验证按钮完成账号启用。</p><p><img src="https://support.macromicro.me/hc/article_attachments/9184768255119" width="532" height="537"></p><p>📌 温馨提醒：每种方式各自建立的账号系统视为独立账号。。若在注册后想在同一账号中新增其他登录方式，请使用原始登录方式登录后，再至「<a href="https://sc.macromicro.me/user/settings" target="_blank" rel="noopener noreferrer"><span data-sheets-hyperlinkruns='{"1":43,"2":"https://www.macromicro.me/user/settings"}{"1":47}' data-sheets-root="1" data-sheets-textstyleruns='{"1":0}{"1":43,"2":{"2":{"1":2,"2":1136076},"9":1}}{"1":47}' data-sheets-userformat='{"2":1051521,"3":{"1":0},"10":1,"11":4,"12":0,"14":{"1":2,"2":0},"23":1}' data-sheets-value='{"1":2,"2":"目前有 Email 帳號及社群帳號等兩種註冊方式，若於註冊後想新增其他登入方式，請於「會員檔案」進行設定。"}' dir="ltr">会员档案</span></a>」设置新增其他登录方式。</p><p> </p><p> </p>
