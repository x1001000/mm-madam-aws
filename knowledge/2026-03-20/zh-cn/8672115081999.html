<h1>如何取消自动续订？</h1>
<p><span data-sheets-root="1">您可以随时取消自动续订，操作方式如下：</span><br><br><span data-sheets-root="1">■ 信用卡付款订阅</span><br><span data-sheets-root="1">前往 </span><a href="https://en.macromicro.me/user/settings"><span data-sheets-root="1">会员档案 </span></a><span data-sheets-root="1">&gt; </span><a href="https://sc.macromicro.me/user/order-history"><span data-sheets-root="1">付费纪录</span></a><span data-sheets-root="1">，调整订阅状态即可。建议在扣款日前完成操作。</span><br><br><span data-sheets-root="1">■ PayPal 订阅</span><br><span data-sheets-root="1">请回到 PayPal 平台自行取消绑定。</span><br><span data-sheets-root="1">取消后，自下期起停止自动续约，目前效期内的使用权益不受影响，您仍可正常使用至效期结束。</span></p><p><br><span data-sheets-root="1">若有任何问题，欢迎随时联系 support@macromicro.me！</span></p>
