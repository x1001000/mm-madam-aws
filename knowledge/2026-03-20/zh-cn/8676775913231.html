<h1>有提供 App 下载吗？</h1>
<p dir="ltr"><span data-sheets-root="1">目前 M平方还没有独立的 APP，但手机用户可以通过以下步骤，把 M平方网站加到手机桌面，使用起来就像 APP 一样方便！</span><br><br><span data-sheets-root="1">■ iOS（苹果手机）</span><br><span data-sheets-root="1">1. 使用 Safari 打开 macromicro.me</span><br><span data-sheets-root="1">2. 点击下方中间的「向上箭头」图标</span><br><span data-sheets-root="1">3. 选择「加入主画面」</span><br><span data-sheets-root="1">4. 命名为「财经M平方」后点击新增</span><br><br><span data-sheets-root="1">■ Android（安卓手机）</span><br><span data-sheets-root="1">1. 使用 Chrome 打开 macromicro.me</span><br><span data-sheets-root="1">2. 点击右上方「⋮」图标</span><br><span data-sheets-root="1">3. 选择「加入主画面」</span><br><span data-sheets-root="1">4. 命名后确认新增</span><br><br><span data-sheets-root="1">设置完成后，就可以直接从桌面一键打开 M平方！</span></p>
