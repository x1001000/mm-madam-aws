<h1>如何更改電子報收件信箱？</h1>
<p><span data-sheets-root="1">更改电子报收件邮箱很简单，自己就可以操作！</span></p><ol>
<li data-list-item-id="e454c7ff92f2ce0bfcf2f11cb7682fa69">
<p dir="ltr"><span data-sheets-root="1">登录订阅账号后，点击网站右上角的「会员头像菜单」→「</span><a href="https://sc.macromicro.me/user/settings" target="_blank" rel="noopener noreferrer"><span data-sheets-root="1">会员档案</span></a><span data-sheets-root="1">」</span></p>
<p><img class="wysiwyg-image-resized" style="aspect-ratio: 1104/734; width: 50%;" src="https://support.macromicro.me/hc/article_attachments/15517906820751" width="1104" height="734"></p>
<p> </p>
</li>
<li data-list-item-id="e49d22c97d356f702f17a65d0d71fbfb5">
<p dir="ltr"><span data-sheets-root="1">点击「编辑」，</span><span data-sheets-root="1">即可更改电子报收件邮箱。</span></p>
<p><img class="wysiwyg-image-resized" style="aspect-ratio: 1108/652; width: 50%;" src="https://support.macromicro.me/hc/article_attachments/15517935623567" width="1108" height="652"></p>
<p><img class="wysiwyg-image-resized" style="aspect-ratio: 1110/1284; width: 50%;" src="https://support.macromicro.me/hc/article_attachments/15517906821007" width="1110" height="1284"></p>
</li>
</ol><p><br><span data-sheets-root="1">📌 请注意：更改收件邮箱不等于更改账号登录邮箱，两者是独立的设置。若您同时需要更改登录邮箱，请来信 support@macromicro.me，我们会协助您处理。</span></p>
