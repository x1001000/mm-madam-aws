<h1>如何将月缴方案转为年缴方案？</h1>
<p><span data-sheets-root="1">想从月缴转为年缴，操作很简单！</span><br><br><span data-sheets-root="1">登录订阅账号后，点击网站右上角的「会员头像菜单」→「</span><a href="https://sc.macromicro.me/user/settings" target="_blank" rel="noopener noreferrer"><span data-sheets-root="1">会员档案</span></a><span data-sheets-root="1">」→ 点击「升级方案」进行设置。</span><br><br><span data-sheets-root="1">设置后，将于下一次续约扣款时正式切换为年缴方案计费。</span><br><br><span data-sheets-root="1">💡 小提醒：年缴方案享有比月缴更优惠的价格，而且可以长期锁定入会时的方案优惠，不受未来调价影响！</span></p>
