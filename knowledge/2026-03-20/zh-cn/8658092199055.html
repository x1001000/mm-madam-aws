<h1>如何更改 Email 帐号的登入信箱？</h1>
<p>目前更改登入信箱需要由客服人工协助，操作很简单，来信告诉我们就好！</p><p><br><strong>请以原本登入的信箱来信 support@macromicro.me，并提供想更改的新信箱</strong><br><strong>客服确认后，将于工作时间（周一至周五 10:00–18:00 GMT+8）为您完成变更。</strong></p><p> </p><p>⚠️ 小提醒：若您同时有绑定 Google / Facebook 社群登入，更改信箱后请至「<a href="https://sc.macromicro.me/user/settings">会员档案</a>」确认社群登入的绑定状态是否正常。</p>
