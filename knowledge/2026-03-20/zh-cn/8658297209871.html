<h1>订阅会员会有装置或 IP 限制吗？</h1>
<p><span data-sheets-root="1">每个账号最多可同时在两个设备上登录，方便您在不同设备间灵活切换。</span><br><span data-sheets-root="1">例如，同时在手机与平板电脑上登录，即使在相同的网络环境（IP）下，也会被计算为两个设备。</span><br><span data-sheets-root="1">若您是 MM Business 方案下新增的线上团队协作者，每位协作者同样享有两个设备的同时登录权限。</span></p><p><span data-sheets-root="1">⚠️ </span><span data-sheets-root="1">提醒您，请妥善保管您的帐号、密码及使用装置限本人使用。若系统侦测到异常登入行为，为保障帐户安全，可能暂时限制帐号使用 。</span></p>
