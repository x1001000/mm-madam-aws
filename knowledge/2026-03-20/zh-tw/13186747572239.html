<h1>為什麼登入中的帳號一直被登出，經常要重新登入?</h1>
<p>遇到這個狀況通常與瀏覽器設定有關，請先參考以下說明：</p><p>目前網站採用「rolling 七日」機制，只要在登入後七日內再次造訪網站，系統就會自動延長登入狀態，讓您持續保持登入。</p><p>但如果您習慣清除瀏覽器快取，或是使用無痕模式瀏覽，登入憑證就會被清除，系統也會視為已登出，因此每次使用時需要重新登入。</p><p>為了避免頻繁重新登入，建議：<br>・避免手動清除瀏覽器快取與網站資料<br>・使用一般模式（非無痕模式）開啟網站</p><p>若依上述調整後問題仍持續，歡迎來信 support@macromicro.me 說明情況，我們會進一步協助！</p>
