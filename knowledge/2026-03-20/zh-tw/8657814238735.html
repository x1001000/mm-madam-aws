<h1>目前提供哪些方式註冊？</h1>
<p><span data-sheets-hyperlinkruns='{"1":43,"2":"https://www.macromicro.me/user/settings"}{"1":47}' data-sheets-root="1" data-sheets-textstyleruns='{"1":0}{"1":43,"2":{"2":{"1":2,"2":1136076},"9":1}}{"1":47}' data-sheets-userformat='{"2":1051521,"3":{"1":0},"10":1,"11":4,"12":0,"14":{"1":2,"2":0},"23":1}' data-sheets-value='{"1":2,"2":"目前有 Email 帳號及社群帳號等兩種註冊方式，若於註冊後想新增其他登入方式，請於「會員檔案」進行設定。"}'>財經Ｍ平方提供兩大類註冊方式：</span></p><h3 id="h_01HMTYTYBXWC21YRJQW8226E4R"><span data-sheets-hyperlinkruns='{"1":43,"2":"https://www.macromicro.me/user/settings"}{"1":47}' data-sheets-root="1" data-sheets-textstyleruns='{"1":0}{"1":43,"2":{"2":{"1":2,"2":1136076},"9":1}}{"1":47}' data-sheets-userformat='{"2":1051521,"3":{"1":0},"10":1,"11":4,"12":0,"14":{"1":2,"2":0},"23":1}' data-sheets-value='{"1":2,"2":"目前有 Email 帳號及社群帳號等兩種註冊方式，若於註冊後想新增其他登入方式，請於「會員檔案」進行設定。"}'>一、社群帳號</span></h3><p>您可以透過社群帳號快速註冊/登入，目前共有三個社群支援這項服務</p><p><img src="https://support.macromicro.me/hc/article_attachments/9184797360655" width="468" height="171"></p><h3 id="h_01KM2QHJGXT26KJCRKKMC79B37"> </h3><h3 id="h_01HMTYSKEE11NHS5QNM84RXYRF"><span data-sheets-hyperlinkruns='{"1":43,"2":"https://www.macromicro.me/user/settings"}{"1":47}' data-sheets-root="1" data-sheets-textstyleruns='{"1":0}{"1":43,"2":{"2":{"1":2,"2":1136076},"9":1}}{"1":47}' data-sheets-userformat='{"2":1051521,"3":{"1":0},"10":1,"11":4,"12":0,"14":{"1":2,"2":0},"23":1}' data-sheets-value='{"1":2,"2":"目前有 Email 帳號及社群帳號等兩種註冊方式，若於註冊後想新增其他登入方式，請於「會員檔案」進行設定。"}'>二、Email 帳號</span></h3><p>您可以使用任意慣用 Email 及自行設定一組密碼，來創建一般會員帳號。</p><p><img src="https://support.macromicro.me/hc/article_attachments/9184744477967" width="463" height="484"></p><p>在創建帳號後，系統將發送一封帳號啟用驗證信，收到信件後，請務必點選信件內的驗證按鈕完成帳號啟用。</p><p>📌 溫馨提醒：每種方式各自建立的帳號系統視為獨立帳號。若想在同一帳號下新增其他登入方式，請先用原始方式登入後，至「<a class="in-cell-link" href="https://www.macromicro.me/user/settings" target="_blank" rel="noopener noreferrer"><span data-sheets-hyperlinkruns='{"1":43,"2":"https://www.macromicro.me/user/settings"}{"1":47}' data-sheets-root="1" data-sheets-textstyleruns='{"1":0}{"1":43,"2":{"2":{"1":2,"2":1136076},"9":1}}{"1":47}' data-sheets-userformat='{"2":1051521,"3":{"1":0},"10":1,"11":4,"12":0,"14":{"1":2,"2":0},"23":1}' data-sheets-value='{"1":2,"2":"目前有 Email 帳號及社群帳號等兩種註冊方式，若於註冊後想新增其他登入方式，請於「會員檔案」進行設定。"}'>會員檔案</span></a>」進行設定。</p>
