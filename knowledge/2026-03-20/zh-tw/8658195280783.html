<h1>如何更改電子報收件信箱？</h1>
<p><span data-sheets-root="1">更改電子報收件信箱很簡單，自己就可以操作！</span></p><ol>
<li data-list-item-id="ef558c65f32413ddba0a390c40f177051">
<p>登入訂閱帳號後，點擊網站右上角的「會員頭像選單」→「<a href="https://www.macromicro.me/user/settings" target="_blank" rel="noopener noreferrer"><span dir="ltr" data-sheets-root="1" data-sheets-userformat='{"2":1051521,"3":{"1":0},"10":1,"11":4,"12":0,"14":{"1":2,"2":0},"23":1}' data-sheets-value="data-sheets-value">會員檔案</span></a><span dir="ltr" data-sheets-root="1" data-sheets-userformat='{"2":1051521,"3":{"1":0},"10":1,"11":4,"12":0,"14":{"1":2,"2":0},"23":1}' data-sheets-value="data-sheets-value">」</span></p>
<p><img class="wysiwyg-image-resized" style="aspect-ratio: 497/341; width: 50%;" src="https://support.macromicro.me/hc/article_attachments/15517904739087" width="497" height="341"></p>
<p> </p>
</li>
<li data-list-item-id="e352174493de13b355b23fad7d7094e58">
<p>點擊「編輯」，即可修改電子報通知信箱設定等資料。</p>
<p><img class="wysiwyg-image-resized" style="aspect-ratio: 996/586; width: 50%;" src="https://support.macromicro.me/hc/article_attachments/15517904739215" width="996" height="586"></p>
<p><img class="wysiwyg-image-resized" style="aspect-ratio: 992/1266; width: 50%;" src="https://support.macromicro.me/hc/article_attachments/15517918719631" width="992" height="1266"></p>
<p><br><br><span data-sheets-root="1">📌 請注意：更改收件信箱不等於更改帳號登入信箱，兩者是獨立的設定。若您同時需要更改登入信箱，請來信 </span><a href="mailto:support@macromicro.me%EF%BC%8C%E6%88%91%E5%80%91%E6%9C%83%E5%8D%94%E5%8A%A9%E6%82%A8%E8%99%95%E7%90%86%E3%80%82"><span data-sheets-root="1">support@macromicro.me</span></a><span data-sheets-root="1">，我們會協助您處理。</span></p>
</li>
</ol><p> </p>
