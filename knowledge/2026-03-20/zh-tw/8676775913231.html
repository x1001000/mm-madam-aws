<h1>有提供 App 下載嗎？</h1>
<p><span data-sheets-root="1">目前 M平方還沒有獨立的 APP，但手機用戶可以透過以下步驟，把 M平方網站加到手機桌面，使用起來就像 APP 一樣方便！</span><br><br><span data-sheets-root="1">■ iOS（蘋果手機）</span><br><span data-sheets-root="1">1. 使用 Safari 開啟 macromicro.me</span><br><span data-sheets-root="1">2. 點擊下方中間的「向上箭頭」圖示</span><br><span data-sheets-root="1">3. 選擇「加入主畫面」</span><br><span data-sheets-root="1">4. 命名為「財經M平方」後點擊新增</span><br><br><span data-sheets-root="1">■ Android（安卓手機）</span><br><span data-sheets-root="1">1. 使用 Chrome 開啟 macromicro.me</span><br><span data-sheets-root="1">2. 點擊右上方「⋮」圖示</span><br><span data-sheets-root="1">3. 選擇「加入主畫面」</span><br><span data-sheets-root="1">4. 命名後確認新增</span><br><br><span data-sheets-root="1">設定完成後，就可以直接從桌面一鍵開啟 M平方！</span></p><p> </p><p> </p>
