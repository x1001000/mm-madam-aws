<h1>註冊帳號後，登入使用是否有裝置或 IP 限制？</h1>
<p><span data-sheets-root="1">每個帳號最多可同時在兩個裝置上登入，方便您彈性使用。</span><br><span data-sheets-root="1">例如，同時在手機與平板電腦上登入會員帳號，即使在相同的網路環境（IP）下，也會被計算為兩個裝置。</span><br><span data-sheets-root="1">若您訂閱的是團隊方案，主帳號新增的每位子帳號也同樣享有兩個裝置的同時登入權限。</span></p><p><span data-sheets-root="1">⚠️ 提醒您，請妥善保管您的帳號、密碼及使用裝置限本人使用。若系統偵測到異常登入行為，為保障帳戶安全，可能暫時限制帳號使用 。</span></p>
