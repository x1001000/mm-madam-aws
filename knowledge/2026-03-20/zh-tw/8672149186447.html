<h1>訂閱付款的信用卡到期或掛失，如何更換扣款信用卡？</h1>
<p><span data-sheets-root="1">信用卡到期或掛失需要更換，操作很簡單，自己就可以完成！</span><br><br><span data-sheets-root="1">點擊網站右上角的大頭貼 →「</span><a href="https://www.macromicro.me/user/settings"><span data-sheets-root="1">會員檔案</span></a><span data-sheets-root="1">」→「</span><a href="https://www.macromicro.me/user/order-history" target="_blank" rel="noopener noreferrer"><span data-sheets-root="1" data-sheets-userformat='{"2":1051521,"3":{"1":0},"10":1,"11":4,"12":0,"14":{"1":2,"2":0},"23":1}' data-sheets-value="data-sheets-value">付費紀錄</span></a><span data-sheets-root="1">」，即可找到「更換/設定信用卡」按鈕進行操作。</span><br><br><span data-sheets-root="1">💡 小提醒：更換信用卡後時，通常系統會先扣款 1 元確認卡片有效，並於三日後退款；設定完成後，下次續約將以新信用卡扣款。</span></p>
