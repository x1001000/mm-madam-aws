<h1>如何更改密碼？</h1>
<p><span data-sheets-root="1">更改密碼有兩種方式，選擇您方便的方式操作即可：</span><br><br><span data-sheets-root="1">1. 登入後更改：點擊網站右上角的「會員頭像選單」→「</span><a href="https://www.macromicro.me/user/settings"><span data-sheets-root="1">會員檔案</span></a><span data-sheets-root="1">」，即可設定新密碼。點擊登入方式旁的「鉛筆圖示」即可設定新密碼。</span></p><p><img class="wysiwyg-image-resized" style="aspect-ratio: 714/796; width: 37.93%;" src="https://support.macromicro.me/hc/article_attachments/15517855971087" width="714" height="796"><span data-sheets-root="1"><img class="wysiwyg-image-resized" style="width: 41.51%;"></span><br><br><span data-sheets-root="1">2. 忘記密碼時：前往 </span><a href="https://www.macromicro.me/login?next=%2F"><span data-sheets-root="1">登入頁面</span></a><span data-sheets-root="1">，使用「忘記密碼」功能，系統會寄送重設連結至您的信箱。</span></p><p> </p>
