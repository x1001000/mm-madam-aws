<p><span data-sheets-root="1">目前更改登入信箱需要由客服人工協助，操作很簡單，來信告訴我們就好！</span></p><p><br><span data-sheets-root="1"><strong>請以原本登入的信箱來信 support@macromicro.me，並提供想更改的新信箱</strong></span><br><span data-sheets-root="1"><strong>客服確認後，將於工作時間（週一至週五 10:00–18:00 GMT+8）為您完成變更。</strong></span></p><p><br><br><span data-sheets-root="1">⚠️ 小提醒：若您同時有綁定 Google / Facebook 社群登入，更改信箱後請至「</span><a href="https://www.macromicro.me/user/settings"><span data-sheets-root="1">會員檔案</span></a><span data-sheets-root="1">」確認社群登入的綁定狀態是否正常。</span></p>
