<h1>約定信用卡安全嗎？</h1>
<p><span data-sheets-root="1">請放心，您的信用卡資訊受到嚴密保護！</span><br><br> </p><ul>
<li data-list-item-id="e19ebe749e310f587d7d84686c7e48eb8"><span data-sheets-root="1">所有信用卡相關資訊皆以 SSL 256bit 加密機制保管於金流系統，MacroMicro 平台本身不儲存完整卡號</span></li>
<li data-list-item-id="e3038cdd849bd9d5a8cf1bb379ba9782b"><span data-sheets-root="1">平台僅記錄信用卡的前六碼與後四碼，用於對帳確認，就像您刷卡後收到的簽單資訊一樣。</span></li>
</ul>
