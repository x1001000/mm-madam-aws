<h1>如何使用MM Business進行團隊協作？</h1>
<p><span data-sheets-root="1">MM Business 的團隊協作功能，可以讓多位成員共用下載額度和分享圖表，非常適合團隊使用！</span><br><br><span data-sheets-root="1">設定方式：</span><br><span data-sheets-root="1">點擊網站右上角的大頭貼 →「會員檔案」→「</span><a href="https://www.macromicro.me/user/subaccounts"><span data-sheets-root="1">團隊帳號管理</span></a><span data-sheets-root="1">」→ 新增協作者帳號，即可啟用協作功能。</span><br><br><span data-sheets-root="1">啟用後，團隊成員可共用數據下載額度（月繳每月 200 筆、年繳每月 500 筆），也可在「</span><a href="https://www.macromicro.me/user/dashboards"><span data-sheets-root="1">我的儀表板</span></a><span data-sheets-root="1">」中分享圖組及圖表，還能查看所有成員的</span><a href="https://www.macromicro.me/user/download-history"><span data-sheets-root="1">下載紀錄</span></a><span data-sheets-root="1">。</span><br><br><span data-sheets-root="1">若在設定過程有任何問題，歡迎來信 business@macromicro.me，我們很樂意協助！</span></p>
