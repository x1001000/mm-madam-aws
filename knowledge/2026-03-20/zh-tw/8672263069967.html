<h1>使用信用卡付款訂閱，沒收到 3D OTP 驗證簡訊怎麼辦？</h1>
<p><span class="wysiwyg-font-size-large"><span data-sheets-root="1">3D 驗證簡訊由您的發卡銀行負責發送，如果一直沒有收到相關驗證簡訊，請試試以下步驟：</span></span></p><p><br><span data-sheets-root="1">1. 確認手機網路訊號正常，且未開啟勿擾模式</span><br><span data-sheets-root="1">2. 稍等約 1–2 分鐘（部分銀行發送速度較慢）</span><br><span data-sheets-root="1">3. 關閉目前頁面，重新從訂閱頁面開始付款流程</span><br><br><span data-sheets-root="1">若多次嘗試後仍未收到，建議直接聯繫您的發卡銀行，確認 3D 驗證服務是否已開通</span></p>
