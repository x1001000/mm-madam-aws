<h1>如何升級訂閱方案？</h1>
<p data-pm-slice="1 1 []"><span data-sheets-root="1">想升級訂閱方案？以下是操作方式：</span><br><br><span class="wysiwyg-font-size-large"><span data-sheets-root="1">■ 信用卡付款的用戶</span></span><br><span data-sheets-root="1">登入訂閱帳號後，點擊網站右上角的「會員頭像選單」→「</span><a href="https://www.macromicro.me/user/settings" target="_blank" rel="noopener noreferrer"><span dir="ltr" data-sheets-root="1" data-sheets-userformat='{"2":2945,"3":{"1":0},"10":1,"11":4,"12":0,"14":{"1":2,"2":0}}' data-sheets-value='{"1":2,"2":"目前僅可以升級訂閱方案，請於登入後至「會員檔案」中即可以由 MM PRO 訂閱升級成 MM Prime。"}'>會員檔案</span></a><span data-sheets-root="1">」→ 點擊「升級方案」即可設定。升級後，系統會先依方案價差調整剩餘訂閱效期，並於下次續約扣款時正式以新方案計費。</span><br><br><span class="wysiwyg-font-size-large"><span data-sheets-root="1">■ 非信用卡付款的用戶</span></span><br><span data-sheets-root="1">需先補齊方案價差後再進行調整，歡迎 </span><a href="https://support.macromicro.me/hc/zh-tw/requests/new" target="_blank" rel="noopener noreferrer"><span data-sheets-root="1">提交表單</span></a><span data-sheets-root="1"> 聯繫客服團隊，我們會協助您完成升級！</span><br><br><span data-sheets-root="1">若有任何問題，歡迎隨時來信 support@macromicro.me，我們很樂意協助！</span></p>
