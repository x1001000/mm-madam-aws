transform: none; white-space: normal; widows: 2; word-spacing: 0px;"> </span></span></p><p><img style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;" src="https://support.macromicro.me/hc/article_attachments/10394199476239" alt="mceclip0.jpg" width="402" height="561"><br><span data-sheets-root="1">1. 開啟 Apple Podcast App</span><br><span data-sheets-root="1">2. 找到「MacroMicro 財經M平方」頻道</span><br><span data-sheets-root="1">3. 點選右上角「⋯」</span><br><span data-sheets-root="1">4. 選擇「設定」</span><br><span data-sheets-root="1">5. 在「集數順序」中選擇您偏好的排列方式</span></p>
