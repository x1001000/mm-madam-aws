<h1>購買課程後可以退款嗎？</h1>
<p><span data-sheets-root="1">購買課程後的退費說明如下：</span><br><br><span data-sheets-root="1">■ 已上架課程</span><br><span data-sheets-root="1">購買後一經觀看，將不予退費，請在購買前先善用試閱功能確認課程內容是否符合您的需求。</span><br><br><span data-sheets-root="1">■ 預購課程（尚未上架）</span><br><span data-sheets-root="1">可依課程預購說明申請退費，退費將扣除金流處理手續費後執行。</span><br><br><span data-sheets-root="1">若有退費相關問題或特殊情況，歡迎來信 support@macromicro.me 說明，我們會視情況協助您！</span></p>
