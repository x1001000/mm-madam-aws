<h1>訂閱會員會有裝置或 IP 限制嗎？</h1>
<p><span data-sheets-root="1">每個帳號最多可同時在兩個裝置上登入，方便您在不同設備間靈活切換。</span><br><span data-sheets-root="1">例如，同時在手機與平板電腦上登入，即使在相同的網路環境（IP）下，也會被計算為兩個裝置。</span><br><span data-sheets-root="1">若您是 MM Business 方案下新增的線上團隊協作者，每位協作者同樣享有兩個裝置的同時登入權限。</span></p><p><span data-sheets-root="1">⚠️ 提醒您，請妥善保管您的帳號、密碼及使用裝置限本人使用。若系統偵測到異常登入行為，為保障帳戶安全，可能暫時限制帳號使用 。</span></p>
