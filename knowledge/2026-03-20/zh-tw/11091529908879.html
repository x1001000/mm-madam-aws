<p><span data-sheets-root="1">合併成功後，您就可以用同一個信箱，無論選擇「Email 帳號」還是「社群帳號」登入，都能順利進入同一個帳號。</span></p><p><br><span data-sheets-root="1">歡迎前往「</span><a href="https://www.macromicro.me/user/settings"><span data-sheets-root="1">會員檔案</span></a><span data-sheets-root="1">」確認目前登入方式，若登入後發現訂閱權益或設定沒有同步，請來信 support@macromicro.me 告訴我們，將由客服團隊為您確認。</span></p>
