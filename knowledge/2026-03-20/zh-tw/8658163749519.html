<h1>如何修改個人資料？</h1>
<p>修改個人資料很簡單，自己就可以操作！</p><ol>
<li data-list-item-id="e4028f4bb43aea193b4438129464ce699">
<p>登入訂閱帳號後，點擊網站右上角的「會員頭像選單」→「<a href="https://www.macromicro.me/user/settings" target="_blank" rel="noopener noreferrer"><span dir="ltr" data-sheets-root="1" data-sheets-userformat='{"2":1051521,"3":{"1":0},"10":1,"11":4,"12":0,"14":{"1":2,"2":0},"23":1}' data-sheets-value="data-sheets-value">會員檔案</span></a>」</p>
<p><img class="wysiwyg-image-resized" style="aspect-ratio: 497/341; width: 50%;" src="https://support.macromicro.me/hc/article_attachments/15517753926287" width="497" height="341"></p>
<p> </p>
</li>
<li data-list-item-id="ee53215f504a550ec203db98bbf52c288">
<p>點擊「編輯」，即可修改姓名、信箱通知設定、發票統編等相關資料。</p>
<p><img class="wysiwyg-image-resized" style="aspect-ratio: 996/586; width: 50%;" src="https://support.macromicro.me/hc/article_attachments/15517725042191" width="996" height="586"></p>

</li>
</ol><p> </p>
