<p><span data-sheets-root="1">為了讓您能提前安排，我們提供以下通知機制：</span><br><br><span data-sheets-root="1">■ 年繳方案</span><br><span data-sheets-root="1">系統將於扣款前 10 日自動寄送提醒信至您的會員信箱。若不希望續約，依照信件引導，關閉自動續約即可。</span><br><br><span data-sheets-root="1">■ 月繳方案</span><br><span data-sheets-root="1">因扣款間隔較短，目前未設固定提醒信。建議您確認下次扣款日期，以便提前規劃。</span><br><br><span data-sheets-root="1">若您沒有收到年繳提醒信，也請先確認是否被誤移至垃圾郵件匣。有任何疑問都歡迎來信 support@macromicro.me</span></p>
