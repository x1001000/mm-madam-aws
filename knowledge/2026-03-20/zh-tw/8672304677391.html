<h1>付款後何時會收到發票？發票形式為何？</h1>
<p><span data-sheets-root="1">付款後的發票開立流程說明如下：</span><br><br><span data-sheets-root="1">■ 何時收到</span><br><span data-sheets-root="1">發票將於付款完成後 3 個工作天內開立，系統會自動寄送開立通知信至您的會員信箱，請記得查收。</span><br><br><span data-sheets-root="1">■ 含統編發票</span><br><span data-sheets-root="1">通知信內的「發票明細」連結可下載含統編的電子發票正本，方便報帳使用。</span><br><br><span data-sheets-root="1">■ 不含統編發票</span><br><span data-sheets-root="1">通知信僅作為開立確認，無法另外下載發票。</span><br><br><span data-sheets-root="1">若有任何發票相關問題，歡迎隨時來信 support@macromicro.me，我們很樂意協助！</span></p><p> </p>
