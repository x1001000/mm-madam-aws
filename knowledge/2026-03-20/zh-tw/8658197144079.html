<h1>如何取消電子報信件？</h1>
<p><span data-sheets-root="1">取消電子報訂閱有兩種方式：</span><br><br><span data-sheets-root="1">1. 直接在電子報中取消：每封電子報下方都有「cancel here」取消連結，點選即可退訂。</span><br><br><span data-sheets-root="1">2. 從會員設定取消：</span></p><ul>
<li data-list-item-id="e8f09ddfc96b4ef7b8f23a868ab7673f5">
<p>登入訂閱帳號後，點擊網站右上角的「會員頭像選單」→「<a href="https://www.macromicro.me/user/settings" target="_blank" rel="noopener noreferrer"><span dir="ltr" data-sheets-root="1" data-sheets-userformat='{"2":1051521,"3":{"1":0},"10":1,"11":4,"12":0,"14":{"1":2,"2":0},"23":1}' data-sheets-value="data-sheets-value">會員檔案</span></a><span dir="ltr" data-sheets-root="1" data-sheets-userformat='{"2":1051521,"3":{"1":0},"10":1,"11":4,"12":0,"14":{"1":2,"2":0},"23":1}' data-sheets-value="data-sheets-value">」</span></p>
<p><img class="wysiwyg-image-resized" style="aspect-ratio: 497/341; width: 50%;" src="https://support.macromicro.me/hc/article_attachments/15517928366607" width="497" height="341"></p>
<p> </p>
</li>
<li data-list-item-id="e9f66b950b20fb35b7ad69eabe62641df">
<p>點擊「編輯」，即可修改電子報通知信箱設定等資料。</p>
<p><img class="wysiwyg-image-resized" style="aspect-ratio: 996/586; width: 50%;" src="https://support.macromicro.me/hc/article_attachments/15517923811215" width="996" height="586"></p>

</li>
</ul><p> </p>
