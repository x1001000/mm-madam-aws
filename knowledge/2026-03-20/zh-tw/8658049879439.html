<h1>如何刪除帳號？</h1>
<p data-start="30" data-end="112">若您確定要刪除帳號，需由客服團隊協助完成。請使用會員信箱寄信至 <a data-start="78" data-end="99" rel="noopener">support@macromicro.me</a><span aria-hidden="true"><a data-start="78" data-end="99" rel="noopener"></a></span>，告知您欲刪除帳號的意願。</p><p data-start="114" data-end="138">⚠️ 請注意，帳號刪除後將無法恢復，請謹慎操作。</p><p data-start="140" data-end="236">刪除前，建議您先確認以下事項，以避免不必要的影響：<br>・若仍有有效訂閱，請先至「付費紀錄」取消自動續約，以避免帳號刪除後仍被扣款<br>・訂閱期間累積的報告與收藏內容將一併刪除，且無法復原</p><p data-start="238" data-end="316">帳號刪除完成後，我們將寄送確認信至您的信箱。同時，也誠摯歡迎您提供使用體驗的回饋給 MM 團隊。我們非常重視每一位用戶的意見，並期待未來有機會再次為您服務。</p>
