<h1>試用時如何取消訂閱？</h1>
<p><span data-sheets-root="1">試用期間可以隨時取消，操作很簡單：</span><br><br><span data-sheets-root="1">前往 </span><a href="https://www.macromicro.me/user/settings" target="_blank" rel="noopener noreferrer"><span data-sheets-root="1" data-sheets-userformat='{"2":2945,"3":{"1":0},"10":1,"11":4,"12":0,"14":{"1":2,"2":0}}' data-sheets-value="data-sheets-value">會員檔案 </span></a><span data-sheets-root="1" data-sheets-userformat='{"2":2945,"3":{"1":0},"10":1,"11":4,"12":0,"14":{"1":2,"2":0}}' data-sheets-value="data-sheets-value">&gt; </span><a href="https://www.macromicro.me/user/order-history" target="_blank" rel="noopener noreferrer"><span data-sheets-root="1" data-sheets-userformat='{"2":2945,"3":{"1":0},"10":1,"11":4,"12":0,"14":{"1":2,"2":0}}' data-sheets-value="data-sheets-value">付費紀錄</span></a><span data-sheets-root="1">，調整訂閱狀態為取消即可。請至少在體驗到期日前一日完成取消，以避免被自動扣款。</span><br><br><span data-sheets-root="1">⚠️ 請注意：若試用期結束前未取消，訂閱方案將自動續訂，扣款日為體驗到期日當天。</span><br><span data-sheets-root="1">📌 溫馨提醒：財經Ｍ平方每年都將視平台規格調漲價格，持續訂閱可終身保有加入時的優惠方案；若取消後重新訂閱，將適用當時最新價格，請列入考量。</span></p>
