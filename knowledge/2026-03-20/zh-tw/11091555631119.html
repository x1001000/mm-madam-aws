<h1>怎麼合併我在網站上註冊的多個帳號？</h1>
<p>不小心用不同方式建立了多個帳號？別擔心，您可以透過以下方式合併，操作方式如下：</p><p><strong>■ 合併「社群帳號」與「Email 帳號」</strong><br><strong>請先使用「社群帳號」登入，系統會自動偵測是否與您的「Email 帳號」使用相同信箱，並自動進行合併。</strong></p><p><strong>■ 合併兩個「社群帳號」</strong><br><strong>請先使用其中一個「社群帳號」登入，系統同樣會自動偵測是否與另一個帳號使用相同信箱，並進行合併。</strong></p><p> </p><p>如果系統沒有自動合併，或需要進一步協助，歡迎來信 support@macromicro.me 由客服團隊協助您。</p><p> </p><p> </p>
