<h1>如何升级訂閱方案？</h1>
<p><strong><span style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">若您使用信用卡付款...</span></strong></p>
<p><span style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">请于登入订阅帐号后，点击网站右上角的 会员头像选单 前往</span> <a style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;" href="https://sc.macromicro.me/user/settings" target="_blank" rel="noreferrer noopener">会员档案</a><span style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;"> 点击「升级方案」设定。</span></p>
<p>设定后将先依据方案之间价差调整剩余订阅效期期限，并于下一次续约扣款时，正式以升等后的新方案扣款。</p>
<p><br><strong>若您使用非信用卡方式付款...</strong></p>
<p>需先补齐方案价差后再进行方案调整，欢迎 <a href="https://support.macromicro.me/hc/zh-cn/requests/new">提交表单</a> 联系客服团队取得协助。</p>
