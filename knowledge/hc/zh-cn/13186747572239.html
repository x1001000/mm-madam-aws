<h1>为什么登录中的账号会被登出，经常需要重新登录？</h1>
<p data-start="39" data-end="122">网站目前采用“滚动七天”的登录机制，只要您在登录后七天内再次访问，系统会自动延长登录状态。</p><p data-start="124" data-end="199">但如果使用<strong data-start="130" data-end="138">无痕模式</strong>浏览，或经常<strong data-start="144" data-end="160">清除浏览器缓存与网站数据</strong>，会导致登录凭证被删除，系统就会视为已登出，因此每次进入网站都需要重新登录。</p><p data-start="201" data-end="207">建议：</p><ul data-start="208" data-end="241">
<li data-start="208" data-end="220">避免使用无痕模式</li>
<li data-start="221" data-end="241">不要频繁清除浏览器缓存与网站资料</li>
</ul><p data-start="243" data-end="259">这样就可以维持较稳定的登录状态。</p>
