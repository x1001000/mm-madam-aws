<h1>如何升級訂閱方案？</h1>
<p><span data-sheets-root="1" data-sheets-userformat='{"2":1051521,"3":{"1":0},"10":1,"11":4,"12":0,"14":{"1":2,"2":0},"23":1}' data-sheets-value="data-sheets-value"><span dir="ltr" data-sheets-root="1" data-sheets-userformat='{"2":2945,"3":{"1":0},"10":1,"11":4,"12":0,"14":{"1":2,"2":0}}' data-sheets-value='{"1":2,"2":"目前僅可以升級訂閱方案，請於登入後至「會員檔案」中即可以由 MM PRO 訂閱升級成 MM Prime。"}'><strong><span style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">若您使用信用卡付款...</span></strong></span></span></p>
<p><span data-sheets-root="1" data-sheets-userformat='{"2":1051521,"3":{"1":0},"10":1,"11":4,"12":0,"14":{"1":2,"2":0},"23":1}' data-sheets-value="data-sheets-value"><span dir="ltr" data-sheets-root="1" data-sheets-userformat='{"2":2945,"3":{"1":0},"10":1,"11":4,"12":0,"14":{"1":2,"2":0}}' data-sheets-value='{"1":2,"2":"目前僅可以升級訂閱方案，請於登入後至「會員檔案」中即可以由 MM PRO 訂閱升級成 MM Prime。"}'>請於登入訂閱帳號後，點擊網站右上角的 <strong>會員頭像選單</strong> 前往 <a href="https://www.macromicro.me/user/settings" target="_blank" rel="noreferrer noopener">會員檔案 </a></span></span><span data-sheets-root="1" data-sheets-userformat='{"2":1051521,"3":{"1":0},"10":1,"11":4,"12":0,"14":{"1":2,"2":0},"23":1}' data-sheets-value="data-sheets-value">點擊「升級方案」設定。</span><br>設定後將先依據方案之間價差調整剩餘訂閱效期期限，並於下一次續約扣款時，正式以升等後的新方案扣款。</p>
<p> </p>
<p data-pm-slice="1 1 []"><strong><span style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">若您使用非信用卡付款...</span></strong></p>
<p data-pm-slice="1 1 []">需先補齊方案價差後再進行方案調整，歡迎<a href="https://support.macromicro.me/hc/zh-tw/requests/new" target="_blank" rel="noopener noreferrer"> 提交表單</a> 聯繫客服團隊取得協助。</p>
